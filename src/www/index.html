<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hologlobe (tm)</title>
    <style>
        :root {
            color-scheme: dark;
        }

        *,

            display: flex;
            justify-content: center;
        }
